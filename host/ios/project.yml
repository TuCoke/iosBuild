# xcodegen 工程描述（不手写 .pbxproj，改这里重新 generate 即可）
#
# 【关键：壳里没有 Go 代码 —— 与参考实现一致】
#
# AutoGoRunner 只有 0.5 MB，它的壳不链任何 Go 产物：
#   · SDK/解释器 在 libagovios.dylib 里，运行时 dlopen
#   · 任务执行体 在 Runtime/app 里，posix_spawn
# 所以我们也不链 libagovios.a、不设 GoLib 的头/库搜索路径。
# 壳只负责：UI、WebView、进程、文件、网络。
#
# 之前链静态归档导致的 _agov_ios_invoke / _res_9_* 未定义符号，
# 在这个结构下不会再出现 —— 因为壳根本不参与 Go 的链接。
name: AgovHost
options:
  bundleIdPrefix: dev.autogov
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    # 壳是纯 ObjC（与参考实现一致）：不开 ARC 会到处手工 release，容易漏内存
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  AgovHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.autogov.host
        PRODUCT_NAME: AgovHost
        INFOPLIST_FILE: Info.plist
        # 壳不引用任何 Go 头文件（全是 ObjC，没有 Swift 桥接头）
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "CoreGraphics"
          # WebView 控制台（WKWebView）
          - "-framework"
          - "WebKit"
          # SDK 动态库的签名校验 / 钥匙串
          - "-framework"
          - "Security"
