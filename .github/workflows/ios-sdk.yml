name: ios-sdk

# 只负责 iOS：能力 SDK 编译验证 + 宿主 App 出未签名 ipa。
# 不构建服务端、控制台或安卓任何内容。
on:
  push:
    paths:
      - 'sdk/ios/**'
      - 'cmd/ioshost/**'
      - 'host/ios/**'
      - '.github/workflows/ios-sdk.yml'
  pull_request:
    paths:
      - 'sdk/ios/**'
      - 'cmd/ioshost/**'
      - 'host/ios/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 能力 SDK 自身的编译验证（快，先跑）────────────────────────────
  ios-sdk:
    name: iOS SDK 编译验证
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '14.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 环境自检
        run: |
          set -x
          sw_vers; uname -m; xcodebuild -version; go version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 解析 iPhoneOS SDK
        id: sdk
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          [ -d "${SDK}" ] || { echo "::error::找不到 iPhoneOS SDK"; exit 1; }
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphoneos -f clang)" >> "$GITHUB_OUTPUT"

      - name: 用真 iPhoneOS SDK 编译全部 .m
        working-directory: sdk/ios/internal/native
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/obj"
          for f in *.m; do
            echo "::group::${f}"
            "${CC_IOS}" -c -arch arm64 -mios-version-min="${IOS_MIN}" \
              -isysroot "${SDK}" "${OBJC_ARC_FLAG}" -fblocks \
              -Wall -Wno-unused-parameter \
              -o "${RUNNER_TEMP}/obj/${f%.m}.o" "${f}"
            echo "::endgroup::"
          done
          ls -l "${RUNNER_TEMP}/obj"

      - name: Go 编译与单测（非 cgo）
        env: { CGO_ENABLED: '0', GOOS: darwin, GOARCH: arm64 }
        run: |
          set -euo pipefail
          go build ./sdk/ios/...
          go test ./sdk/ios/...

      - name: GOOS=ios + cgo 编 Go 包
        env:
          CGO_ENABLED: '1'
          GOOS: ios
          GOARCH: arm64
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CC="${CC_IOS}"
          export CGO_CFLAGS="-arch arm64 -mios-version-min=${IOS_MIN} -isysroot ${SDK} ${OBJC_ARC_FLAG}"
          export CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ImageIO -framework VideoToolbox -framework CoreVideo -framework CoreMedia"
          go build ./sdk/ios/...

      - name: 上传 .o（仅当以上全部成功）
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk-objfiles
          path: ${{ runner.temp }}/obj
          retention-days: 7

  # ── 2. 宿主 App：出未签名 ipa，供本地签名安装 ──────────────────────
  ios-host:
    name: iOS 宿主 App（未签名 ipa）
    needs: ios-sdk
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '14.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 解析 iPhoneOS SDK
        id: sdk
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphoneos -f clang)" >> "$GITHUB_OUTPUT"

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: Go 编 c-archive（libagovios.a + libagovios.h）
        env:
          CGO_ENABLED: '1'
          GOOS: ios
          GOARCH: arm64
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CC="${CC_IOS}"
          export CGO_CFLAGS="-arch arm64 -mios-version-min=${IOS_MIN} -isysroot ${SDK} ${OBJC_ARC_FLAG}"
          mkdir -p host/ios/GoLib
          go build -buildmode=c-archive -o host/ios/GoLib/libagovios.a ./cmd/ioshost
          ls -l host/ios/GoLib

      - name: Go 出 dylib（c-archive + clang -dynamiclib）
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          # Go 在 ios/arm64 上不支持 -buildmode=c-shared，实测报错：
          #   "-buildmode=c-shared not supported on ios/arm64"
          # 参考实现能出 libgoeval.dylib，走的是同一条路：
          #   先用 c-archive 产出 .a，再用 clang -dynamiclib 把它包成 dylib。
          # 导出符号不变（agov_ios_invoke / agov_ios_free），宿主照旧 dlopen。
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC_IOS}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fno-objc-arc"
          export CGO_LDFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN}"
          mkdir -p host/ios/Frameworks
          go build -buildmode=c-archive -trimpath -ldflags "-s -w" \
            -o host/ios/Frameworks/libagovios.a ./cmd/ioshost
          clang -dynamiclib -arch arm64 -isysroot "${SDK}" -mios-version-min="${IOS_MIN}" \
            -Wl,-all_load host/ios/Frameworks/libagovios.a \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -framework CoreGraphics -framework ImageIO -framework VideoToolbox \
            -framework CoreMedia -framework CoreVideo -framework Security \
            -lresolv -lpthread -lm \
            -o host/ios/Frameworks/libagovios.dylib
          file host/ios/Frameworks/libagovios.dylib
          # 任务执行体：与参考实现同路径（Runtime/app），壳 posix_spawn 它，
          # 然后通过 http://127.0.0.1:8989/{status,task?cmd=} 通信。
          mkdir -p host/ios/Runtime
          go build -buildmode=exe -trimpath -ldflags "-s -w" \
            -o host/ios/Runtime/app ./cmd/runtimeapp
          file host/ios/Runtime/app
          ls -lh host/ios/Runtime/app
          ls -lh host/ios/Frameworks/libagovios.dylib
          nm -gU host/ios/Frameworks/libagovios.dylib | grep -E "agov_ios_(invoke|free)" || true


      - name: 准备 frpc（优先用包内预置的 arm64 二进制）
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          PREBUILT="host/ios/Frameworks/frpc-ios"
          if [ -f "${PREBUILT}" ] && [ "$(stat -f%z "${PREBUILT}")" -gt 1000000 ]; then
            echo "::group::使用仓库内预置的 frpc"
            file "${PREBUILT}"
            ls -lh "${PREBUILT}"
            shasum -a 256 "${PREBUILT}"
            echo "::endgroup::"
            exit 0
          fi
          echo "::group::没有预置 frpc，从源码编（frp v0.67.0）"
          # frp 的 go.mod 带 replace，不能 go install，只能拉源码在模块内构建；
          # GOOS=ios 强制要 cgo，CC / CGO_CFLAGS / CGO_LDFLAGS 都要指向 iphoneos SDK。
          git clone --depth 1 --branch v0.67.0 https://github.com/fatedier/frp "${RUNNER_TEMP}/frp"
          cd "${RUNNER_TEMP}/frp"
          # frp 的 cmd/frpc 用 //go:embed 嵌 web/frpc/dist（前端产物，需要 npm 构建）。
          # 我们只要客户端二进制，放个占位文件满足 embed 即可。
          mkdir -p web/frpc/dist
          [ -f web/frpc/dist/index.html ] || echo '<!doctype html><title>frpc</title>' > web/frpc/dist/index.html
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC_IOS}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fno-objc-arc"
          export CGO_LDFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN}"
          go build -trimpath -ldflags "-s -w" -o "${RUNNER_TEMP}/frpc-ios" ./cmd/frpc
          file "${RUNNER_TEMP}/frpc-ios"
          mkdir -p "$GITHUB_WORKSPACE/host/ios/Frameworks"
          cp "${RUNNER_TEMP}/frpc-ios" "$GITHUB_WORKSPACE/${PREBUILT}"
          chmod +x "$GITHUB_WORKSPACE/${PREBUILT}"
          echo "::endgroup::"

      - name: 生成 Xcode 工程
        working-directory: host/ios
        run: |
          set -euo pipefail
          xcodegen generate
          ls -d *.xcodeproj

      - name: 编译 App（不签名）
        working-directory: host/ios
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project AgovHost.xcodeproj \
            -scheme AgovHost \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "::group::关键错误"
            grep -nE "error:|fatal error:|Undefined symbol|ld: |is only available" build.log | head -80 || true
            echo "::endgroup::"
            echo "::group::libagovios 产物"
            ls -l GoLib || true
            head -40 GoLib/libagovios.h 2>/dev/null || echo "没有 libagovios.h"
            echo "::endgroup::"
            exit "${status}"
          fi

      - name: 安装打包工具（ldid / dpkg）
        run: |
          set +e
          brew install ldid 2>&1 | tail -5
          brew install dpkg 2>&1 | tail -5
          command -v ldid   && ldid -v 2>&1 | head -2
          command -v dpkg-deb && dpkg-deb --version | head -1
          echo "（缺哪个都继续：ldid 缺了就退化成 codesign）"

      - name: 注入 entitlements（platform-application 等 970 行权限）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          [ -d "${APP}" ] || { echo "::error::没有找到构建产物 ${APP}"; ls -R host/ios/build/Build/Products || true; exit 1; }
          # 1) 把 entitlements 放进包内：TrollStore 安装时会读取它再签名
          cp host/ios/entitlements.plist "${APP}/entitlements.plist"
          # frpc 放进包内并单独签名 —— 包内可执行文件不签，posix_spawn 会被系统拒绝。
          # 任务执行体：放进包内 Runtime/app（与参考实现同路径），并单独签名
          if [ -f host/ios/Runtime/app ]; then
            mkdir -p "${APP}/Runtime"
            cp host/ios/Runtime/app "${APP}/Runtime/app"
            chmod +x "${APP}/Runtime/app"
            if command -v ldid >/dev/null 2>&1; then
              ldid -Sentitlements.plist "${APP}/Runtime/app"
            else
              codesign -f -s - --entitlements host/ios/entitlements.plist "${APP}/Runtime/app"
            fi
            echo "Runtime/app 已放进包内并签名"; ls -lh "${APP}/Runtime/app"
          else
            echo "::warning::没有 Runtime/app，任务隔离不可用（脚本仍在宿主进程内跑）"
          fi
          # SDK 动态库：放在包内，宿主优先加载它；签名后才能在设备上 dlopen
          if [ -f host/ios/Frameworks/libagovios.dylib ]; then
            cp host/ios/Frameworks/libagovios.dylib "${APP}/libagovios.dylib"
            if command -v ldid >/dev/null 2>&1; then
              ldid -Sentitlements.plist "${APP}/libagovios.dylib"
            else
              codesign -f -s - --entitlements host/ios/entitlements.plist "${APP}/libagovios.dylib"
            fi
            echo "libagovios.dylib 已放进包内并签名"; ls -lh "${APP}/libagovios.dylib"
          else
            echo "::warning::没有 libagovios.dylib，热更能力不可用（仍可用静态 SDK）"
          fi
          if [ -f host/ios/Frameworks/frpc-ios ]; then
            cp host/ios/Frameworks/frpc-ios "${APP}/frpc-ios"
            chmod +x "${APP}/frpc-ios"
            if command -v ldid >/dev/null 2>&1; then
              ldid -Sentitlements.plist "${APP}/frpc-ios"
            else
              codesign -f -s - --entitlements host/ios/entitlements.plist "${APP}/frpc-ios"
            fi
            echo "frpc-ios 已放进包内并签名"; ls -lh "${APP}/frpc-ios"
          else
            echo "::warning::没有 frpc-ios，跳过（隧道功能不可用）"
          fi
          # 2) ldif 在就 ldid -S，否则退化成 codesign（两者都能把 entitlements 嵌进签名）
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sentitlements.plist "${APP}/AgovHost"
            echo "签名方式: ldid -S"
          else
            codesign -f -s - --entitlements host/ios/entitlements.plist "${APP}"
            echo "签名方式: codesign ad-hoc"
          fi
          # 3) 回读校验：签名里到底有没有 platform-application
          codesign -d --entitlements :- "${APP}" 2>/dev/null | head -30 || true

      - name: 断言 frpc 已进包
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          if [ ! -f "${APP}/frpc-ios" ]; then
            echo "::error::frpc-ios 不在 app 包内，隧道功能会失效"
            ls -la "${APP}" || true
            exit 1
          fi
          file "${APP}/frpc-ios"
          ls -lh "${APP}/frpc-ios"
          echo "✅ frpc-ios 已在包内"
          if [ -f "${APP}/Runtime/app" ]; then
            echo "✅ Runtime/app 已在包内（任务隔离就绪）"
          else
            echo "::warning::包内没有 Runtime/app"
          fi
          if [ -f "${APP}/libagovios.dylib" ]; then
            echo "✅ libagovios.dylib 已在包内（热更能力就绪）"
            nm -gU "${APP}/libagovios.dylib" | grep -E "agov_ios_(invoke|free)" || echo "::warning::dylib 里没找到导出符号"
          else
            echo "::warning::包内没有 libagovios.dylib（只能走静态 SDK）"
          fi
      - name: 打成 ipa（含 entitlements）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          rm -rf out && mkdir -p out/Payload
          cp -R "${APP}" out/Payload/
          ( cd out && zip -qry AgovHost.ipa Payload )
          ls -lh out/AgovHost.ipa
          unzip -l out/AgovHost.ipa | head -12

      - name: 打成 deb（越狱机直装）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo "::warning::没有 dpkg-deb，跳过 deb（ipa 仍然可用）"
            exit 0
          fi
          ROOT="debroot"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}/DEBIAN" "${ROOT}/Applications"
          cp -R "${APP}" "${ROOT}/Applications/"
          cat > "${ROOT}/DEBIAN/control" <<'CONTROL'
          Package: dev.autogov.host
          Name: AgovHost
          Version: 0.1.0
          Architecture: iphoneos-arm64
          Description: AutoGo 兼容的 iOS 自动化宿主（诊断版）
          Maintainer: autogov
          Section: Applications
          CONTROL
          dpkg-deb -b --root-owner-group "${ROOT}" out/AgovHost.deb
          ls -lh out/AgovHost.deb

      - name: 上传 ipa 与 deb
        uses: actions/upload-artifact@v4
        with:
          name: AgovHost-signed
          path: |
            out/AgovHost.ipa
            out/AgovHost.deb
          if-no-files-found: warn
          retention-days: 14

  # ── 3. 模拟器冒烟：启动 + 截图 ───────────────────────────────────────
  #
  # 这一轮的用途只有一个：证明 App 能启动、界面正常、Go↔ObjC 桥接通。
  # 模拟器里没有 IOHIDEvent / CARenderServer / Accessibility，
  # 所以 capabilities 会全 false —— 那是预期结果，不是失败。
  ios-sim:
    name: 模拟器冒烟（启动 + 截图）
    needs: ios-sdk
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '14.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 确定构建架构
        id: arch
        run: |
          MACHINE="$(uname -m)"
          if [ "${MACHINE}" = "arm64" ]; then
            echo "goarch=arm64" >> "$GITHUB_OUTPUT"
            echo "xcarch=arm64" >> "$GITHUB_OUTPUT"
            echo "other=x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "goarch=amd64" >> "$GITHUB_OUTPUT"
            echo "xcarch=x86_64" >> "$GITHUB_OUTPUT"
            echo "other=arm64" >> "$GITHUB_OUTPUT"
          fi
          echo "跑器架构: ${MACHINE}"

      - name: 选一台可用的 iPhone 模拟器
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "${RUNNER_TEMP}/devices.json"
          UDID=$(python3 - "${RUNNER_TEMP}/devices.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          names, udids = [], []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      udids.append(d["udid"]); names.append(runtime.split(".")[-1] + "/" + d["name"])
          if not udids:
              sys.exit(1)
          print(udids[0]); print(" + ".join(names[:3]), file=sys.stderr)
          PY
          )
          [ -n "${UDID}" ] || { echo "::error::runner 上没有可用的 iPhone 模拟器"; xcrun simctl list runtimes; exit 1; }
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          echo "选中的模拟器: ${UDID}"

      - name: 解析模拟器 SDK
        id: simsdk
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphonesimulator -f clang)" >> "$GITHUB_OUTPUT"

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: Go 编模拟器 c-archive
        env:
          CGO_ENABLED: '1'
          GOOS: ios
          GOARCH: ${{ steps.arch.outputs.goarch }}
          SDK: ${{ steps.simsdk.outputs.path }}
          CC_SIM: ${{ steps.simsdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CC="${CC_SIM}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-simulator-version-min=${IOS_MIN} ${OBJC_ARC_FLAG}"
          mkdir -p host/ios/GoLib
          go build -buildmode=c-archive -o host/ios/GoLib/libagovios.a ./cmd/ioshost
          ls -l host/ios/GoLib

      - name: 生成 Xcode 工程
        working-directory: host/ios
        run: xcodegen generate

      - name: 编 App（模拟器）
        working-directory: host/ios
        run: |
          set -o pipefail
          set +e
          # 只出 arm64：macos-15 跑器是 Apple Silicon，模拟器原生跑 arm64；
          # 而我们的 Go 归档是 arm64 单架构 —— 默认 xcodebuild 会做 arm64+x86_64
          # 通用二进制，x86_64 那半在没有归档的情况下必然 undefined symbols。
          xcodebuild -project AgovHost.xcodeproj -scheme AgovHost \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            ARCHS=${{ steps.arch.outputs.xcarch }} ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=${{ steps.arch.outputs.other }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee sim-build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "::group::模拟器编译错误"
            grep -nE "error:|Undefined symbol|ld: " sim-build.log | head -40 || true
            echo "::endgroup::"
            exit "${status}"
          fi

      - name: 启动模拟器并安装
        id: run
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "${UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${UDID}" -b
          APP=$(find host/ios/build -name 'AgovHost.app' -maxdepth 8 | head -1)
          [ -d "${APP}" ] || { echo "::error::没找到模拟器产物"; ls -R host/ios/build/Build/Products || true; exit 1; }
          xcrun simctl install "${UDID}" "${APP}"
          xcrun simctl launch "${UDID}" dev.autogov.host || true
          sleep 8
          xcrun simctl io "${UDID}" screenshot "${RUNNER_TEMP}/sim.png"
          ls -l "${RUNNER_TEMP}/sim.png"

      - name: 抓日志（失败时用）
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "${UDID}" log show --last 2m --style compact \
            --predicate 'process == "AgovHost"' 2>/dev/null | tail -60 || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: ${{ runner.temp }}/sim.png
          if-no-files-found: warn
          retention-days: 14
