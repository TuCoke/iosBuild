name: ios-sdk

# 只负责 iOS：能力 SDK 编译验证 + 宿主 App 出未签名 ipa。
# 不构建服务端、控制台或安卓任何内容。
on:
  push:
    paths:
      - 'sdk/ios/**'
      - 'sdk/imaging/**'
      - 'cmd/runtimeapp/**'
      - 'cmd/symbolgen/**'
      - 'cmd/precheck/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/ioshost/**'
      - 'host/ios/**'
      - '.github/workflows/ios-sdk.yml'
  pull_request:
    paths:
      - 'sdk/ios/**'
      - 'sdk/imaging/**'
      - 'cmd/runtimeapp/**'
      - 'cmd/symbolgen/**'
      - 'cmd/precheck/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/ioshost/**'
      - 'host/ios/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Go 单元测试（不需要设备、不需要 macOS，几秒钟出结果）────────
  go-test:
    name: Go 单元测试（纯逻辑）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 静态自检（precheck）
        run: go run ./cmd/precheck

      - name: go vet
        run: go vet ./sdk/... ./cmd/runtimeapp ./cmd/symbolgen

      - name: go test（非 cgo）
        run: |
          set -euo pipefail
          go test ./sdk/... ./cmd/runtimeapp ./cmd/symbolgen -count=1 -v 2>&1 | tee test.log
          echo "---- 汇总 ----"
          grep -E "^(ok|FAIL|---)" test.log | tail -40

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log
          path: test.log
          if-no-files-found: warn
          retention-days: 7

  # ── 1. 能力 SDK 自身的编译验证（快，先跑）────────────────────────────
  ios-sdk:
    name: iOS SDK 编译验证
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '15.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 环境自检
        run: |
          set -x
          sw_vers; uname -m; xcodebuild -version; go version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 静态自检（precheck）
        run: go run ./cmd/precheck

      - name: 解析 iPhoneOS SDK
        id: sdk
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          [ -d "${SDK}" ] || { echo "::error::找不到 iPhoneOS SDK"; exit 1; }
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphoneos -f clang)" >> "$GITHUB_OUTPUT"

      - name: 用真 iPhoneOS SDK 编译全部 .m
        working-directory: sdk/ios/internal/native
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/obj"
          for f in *.m; do
            echo "::group::${f}"
            "${CC_IOS}" -c -arch arm64 -mios-version-min="${IOS_MIN}" \
              -isysroot "${SDK}" "${OBJC_ARC_FLAG}" -fblocks \
              -Wall -Wno-unused-parameter \
              -o "${RUNNER_TEMP}/obj/${f%.m}.o" "${f}"
            echo "::endgroup::"
          done
          ls -l "${RUNNER_TEMP}/obj"

      - name: Go 编译与单测（非 cgo）
        env: { CGO_ENABLED: '0', GOOS: darwin, GOARCH: arm64 }
        run: |
          set -euo pipefail
          go build ./sdk/ios/...
          go test ./sdk/ios/...

      - name: GOOS=ios + cgo 编 Go 包
        env:
          CGO_ENABLED: '1'
          GOOS: ios
          GOARCH: arm64
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CC="${CC_IOS}"
          # CXX 必须给：cgo 编 .mm（ag_rec / imgui_overlay）用 CXX，缺省会退回 g++ 导致 .mm 被跳过，
          # 到链接期才报 _AGRecognition / _AGImGuiOverlay 未定义（已踩过一次）。
          export CXX="${CC_IOS}"
          export CGO_CFLAGS="-arch arm64 -mios-version-min=${IOS_MIN} -isysroot ${SDK} ${OBJC_ARC_FLAG}"
          # .mm 走 CGO_CXXFLAGS：-fobjc-arc 是 ARC 写法要求；两个 -I 给 cimgui/imgui 头（cimgui 内部按 ./imgui 布局引用）
          export CGO_CXXFLAGS="-arch arm64 -mios-version-min=${IOS_MIN} -isysroot ${SDK} -fobjc-arc \
            -I host/ios/third_party/cimgui -I host/ios/third_party/cimgui/imgui \
            -I host/ios/Frameworks/opencv2.framework/Headers"
          export CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ImageIO -framework VideoToolbox -framework CoreVideo -framework CoreMedia"
          go build ./sdk/ios/...

      - name: 上传 .o（仅当以上全部成功）
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk-objfiles
          path: ${{ runner.temp }}/obj
          retention-days: 7

  # ── 2. 宿主 App：出未签名 ipa，供本地签名安装 ──────────────────────
  ios-host:
    name: iOS 宿主 App（未签名 ipa）
    needs: ios-sdk
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '15.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 静态自检（precheck）
        run: go run ./cmd/precheck

      - name: 解析 iPhoneOS SDK
        id: sdk
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphoneos -f clang)" >> "$GITHUB_OUTPUT"

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 准备第三方原生库（OpenCV，供 cgo 编 .mm 用）
        run: |
          set -uo pipefail
          mkdir -p host/ios/Frameworks
          cd host/ios/Frameworks
          if [ ! -d opencv2.framework ]; then
            curl -fL --retry 3 -o /tmp/opencv-ios.zip \
              https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-ios-framework.zip \
              && unzip -q /tmp/opencv-ios.zip -d /tmp/opencv-ios \
              && cp -R /tmp/opencv-ios/opencv2.framework . \
              || echo "::warning::OpenCV 下载失败，ag_rec.mm 会降级为无 OpenCV"
          fi
          ls -1

      - name: Go 编 c-archive（libagovios.a + libagovios.h）
        env:
          CGO_ENABLED: '1'
          GOOS: ios
          GOARCH: arm64
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CC="${CC_IOS}"
          export CGO_CFLAGS="-arch arm64 -mios-version-min=${IOS_MIN} -isysroot ${SDK} ${OBJC_ARC_FLAG}"
          mkdir -p host/ios/GoLib
          go build -buildmode=c-archive -o host/ios/GoLib/libagovios.a ./cmd/ioshost
          ls -l host/ios/GoLib

      - name: 编 libimgui.dylib（imgui 1.92.5 + cimgui 1.92.5 + Metal 后端）
        run: |
          set -euo pipefail
          # 版本与参考实现一致：imgui 1.92.5 + cimgui 1.92.5
          # （cimgui 仓库里 imgui 是子模块，cimgui.cpp 用 "./imgui/..." 引用它）
          CIMGUI=host/ios/third_party/cimgui
          IMGUI="${CIMGUI}/imgui"
          [ -f "${CIMGUI}/cimgui.cpp" ] || { echo "::error::缺少 cimgui 源码"; exit 1; }
          [ -f "${IMGUI}/imgui.cpp" ] || { echo "::error::缺少 imgui 源码"; exit 1; }
          [ -f "${IMGUI}/misc/freetype/imgui_freetype.h" ] || { echo "::error::缺少 misc/freetype 头"; exit 1; }
          SDK_DIR=$(xcrun --sdk iphoneos --show-sdk-path)
          OBJ=host/ios/Frameworks/imgui-obj
          rm -rf "${OBJ}"; mkdir -p "${OBJ}" host/ios/Frameworks
          CXXFLAGS="-O2 -std=c++17 -fno-exceptions -isysroot ${SDK_DIR} -mios-version-min=15.0 -arch arm64 -I ${CIMGUI} -I ${IMGUI} -I ${IMGUI}/backends"
          for f in imgui imgui_draw imgui_tables imgui_widgets imgui_demo; do
            xcrun --sdk iphoneos clang++ -c ${CXXFLAGS} "${IMGUI}/$f.cpp" -o "${OBJ}/$f.o"
          done
          # cimgui：imgui 的 C API（ig* 那一套，与参考实现导出的符号名一致）
          xcrun --sdk iphoneos clang++ -c ${CXXFLAGS} "${CIMGUI}/cimgui.cpp" -o "${OBJ}/cimgui.o"
          # 官方 Metal 后端（参考实现里同样编进去）
          xcrun --sdk iphoneos clang++ -c ${CXXFLAGS} -fobjc-arc \
            "${IMGUI}/backends/imgui_impl_metal.mm" -o "${OBJ}/imgui_impl_metal.o"
          # agIm* 包装层：实现调 ig*，供 Go 的 cgo 使用（Go 包里不能放 .cpp，否则非 cgo 构建报错）
          xcrun --sdk iphoneos clang++ -c ${CXXFLAGS} -I sdk/ios/imgui \
            "${CIMGUI}/ag_bridge.cpp" -o "${OBJ}/ag_bridge.o"
          # 独立 dylib：libagovios 用 @rpath 链接它（与参考实现的 libimgui.dylib 同形态）
          xcrun --sdk iphoneos clang++ -dynamiclib -arch arm64 -isysroot "${SDK_DIR}" \
            -mios-version-min=15.0 -install_name @rpath/libimgui.dylib \
            "${OBJ}"/*.o -framework Metal -framework MetalKit -framework UIKit \
            -framework Foundation -framework CoreGraphics -lc++ \
            -o host/ios/Frameworks/libimgui.dylib
          file host/ios/Frameworks/libimgui.dylib
          # 先把符号表落盘再 grep。
          # 原因：`nm … | grep -q` 在 pipefail 下会假失败 —— grep -q 命中即退出，
          # nm 收到 SIGPIPE 报 "IO failure on output stream"，整条管道非 0（踩过一次）。
          nm -gU host/ios/Frameworks/libimgui.dylib > /tmp/imgui-syms.txt 2>/dev/null || true
          for sym in _igNewFrame _igBegin _igEnd _igTextUnformatted _igSetNextWindowPos _igShowDemoWindow; do
            grep -q " ${sym}$" /tmp/imgui-syms.txt \
              || { echo "::error::libimgui.dylib 缺少 ${sym}（共 $(grep -c '' /tmp/imgui-syms.txt) 个符号）"; exit 1; }
          done
          echo "✅ libimgui.dylib 导出 ig*（imgui 1.92.5 + cimgui 1.92.5）"

      - name: 编 libagovnative.a（ObjC++ 层：识别栈 + imgui 悬浮层）
        run: |
          set -euo pipefail
          # 【为什么这两个 .mm 不放在 Go 包里】
          # go/build 只认 .c/.cc/.cpp/.cxx/.m/.h/.f/.s，没有 .mm 这一项 ——
          # 放在包目录里的 .mm 会被【完全忽略】（实测 go list 的 CXXFiles 是空的），
          # 于是 AGRecognition / AGImGuiOverlay 到链接期才报未定义。
          # 所以把它们当普通 ObjC++ 源单独编成静态库，再链进 dylib。
          SDK_DIR=$(xcrun --sdk iphoneos --show-sdk-path)
          NATIVE=host/ios/objc
          OBJ=host/ios/Frameworks/native-objc
          rm -rf "${OBJ}"; mkdir -p "${OBJ}" host/ios/Frameworks
          FLAGS="-O2 -std=c++17 -fobjc-arc -isysroot ${SDK_DIR} -mios-version-min=15.0 -arch arm64 \
            -I sdk/ios/internal/native \
            -I host/ios/third_party/cimgui -I host/ios/third_party/cimgui/imgui -I host/ios/third_party/cimgui/imgui/backends"
          OPENCV_INC=""
          if [ -d host/ios/Frameworks/opencv2.framework ]; then
            OPENCV_INC="-I host/ios/Frameworks/opencv2.framework/Headers"
          fi
          for f in ag_rec imgui_overlay; do
            xcrun --sdk iphoneos clang++ -c ${FLAGS} ${OPENCV_INC} "${NATIVE}/$f.mm" -o "${OBJ}/$f.o"
          done
          libtool -static -o host/ios/Frameworks/libagovnative.a "${OBJ}"/*.o
          ls -lh host/ios/Frameworks/libagovnative.a

      - name: Go 出 dylib（c-archive + clang -dynamiclib）
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          # Go 在 ios/arm64 上不支持 -buildmode=c-shared，实测报错：
          #   "-buildmode=c-shared not supported on ios/arm64"
          # 参考实现能出 libgoeval.dylib，走的是同一条路：
          #   先用 c-archive 产出 .a，再用 clang -dynamiclib 把它包成 dylib。
          # 导出符号不变（agov_ios_invoke / agov_ios_free），宿主照旧 dlopen。
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC_IOS}"
          # CXX 必须显式指向 iOS/simulator 的 clang++：cgo 编 .mm（ag_rec / imgui_overlay）靠它，
          # 缺省会退回 g++，.mm 直接被跳过 → 链接期报 _AGRecognition 未定义。
          export CXX="${CC_IOS}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fno-objc-arc"
          # -fobjc-arc：native 下的 .mm 用 ARC 写法（不手工 retain/release）
          # -F/-I：让 #import <opencv2/core.hpp> 能找到；找不到时 ag_rec.mm 自动降级为"识别栈不可用"
          export CGO_CXXFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fobjc-arc -I ${PWD}/host/ios/Frameworks/opencv2.framework/Headers -I ${PWD}/host/ios/third_party/cimgui -I ${PWD}/host/ios/third_party/cimgui/imgui"
          export CGO_LDFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN}"
          mkdir -p host/ios/Frameworks
            # 注意：不能加 -ldflags "-s -w"。
            # -s 会去掉符号表，而 agov_ios_invoke/agov_ios_free 是 cgo 导出符号，
            # 去掉后 dylib 里就没有它们（实测：dlsym 失败 + ld 报 <initial-undefines>）。
            go build -buildmode=c-archive -trimpath \
            -o host/ios/Frameworks/libagovios.a ./cmd/ioshost
            echo "归档里的导出符号："
            nm -gU host/ios/Frameworks/libagovios.a 2>/dev/null | grep -E "agov_ios_(invoke|free)" || echo "  （没找到，后面必然失败）"
          # OpenCV：链参考实现自带的 Runtime/libopencv_*.dylib（与它 otool -L 里
          # @rpath/libopencv_core.dylib 等一致）。
          # 不用 opencv2.framework：它带 Swift 兼容库（Calib3dExt.o 引 swiftCompatibility50/51），
          # 会把 Swift 运行时拖进 dylib，并报 __swift_FORCE_LOAD_$ 未定义。
          OPENCV_FLAGS=""
          IMGUI_LIB=""
          if [ -f host/ios/Frameworks/libimgui.dylib ]; then IMGUI_LIB="-L host/ios/Frameworks -limgui"; fi
          if [ -f host/ios/Runtime/libopencv_core.dylib ]; then
            OPENCV_FLAGS="-L host/ios/Runtime -lopencv_core -lopencv_imgproc -lopencv_imgcodecs"
          fi
          clang -dynamiclib -arch arm64 -isysroot "${SDK}" -mios-version-min="${IOS_MIN}" \
            -Wl,-all_load host/ios/Frameworks/libagovios.a \
            host/ios/Frameworks/libagovnative.a \
            ${IMGUI_LIB} \
            -framework Foundation -framework UIKit -framework JavaScriptCore -framework CoreFoundation \
            -framework CoreGraphics -framework ImageIO -framework VideoToolbox \
            -framework CoreMedia -framework CoreVideo -framework Security \
            -framework QuartzCore \
            -framework Accelerate -framework Metal -framework MetalKit \
            -framework IOKit -framework NetworkExtension \
            ${OPENCV_FLAGS} \
            -lresolv -lpthread -lm -lc++ -lc++abi \
            -Wl,-exported_symbol,_agov_ios_invoke \
            -Wl,-exported_symbol,_agov_ios_free \
            -Wl,-exported_symbol,_GoMain \
            -Wl,-exported_symbol,_AXBootstrap \
            -Wl,-exported_symbol,_AXSweepNodesJSON \
            -o host/ios/Frameworks/libagovios.dylib
          file host/ios/Frameworks/libagovios.dylib
          # 断言导出符号真的在（dlsym 失败过两次，所以这里必须校验）
          # 同样先落盘再 grep：`nm | grep -q` 在 pipefail 下会因 SIGPIPE 假失败
          nm -gU host/ios/Frameworks/libagovios.dylib > /tmp/agov-syms.txt 2>/dev/null || true
          for sym in _agov_ios_invoke _agov_ios_free _GoMain _AXBootstrap _AXSweepNodesJSON; do
            if ! grep -q " $sym$" /tmp/agov-syms.txt; then
              echo "::error::dylib 缺少导出符号 $sym"
              grep -E "_agov|_GoMain|_AX" /tmp/agov-syms.txt | head -20 || true
              exit 1
            fi
          done
          echo "✅ 五个入口都导出了"
          # 原生任务启动器加载与宿主相同的动态 SDK，保持更新版本一致。
          mkdir -p host/ios/Runtime
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "${SDK}" \
            -mios-version-min="${IOS_MIN}" -fobjc-arc host/ios/RuntimeMain.m \
            -framework Foundation -framework CoreFoundation \
            -Wl,-rpath,@executable_path -Wl,-rpath,@executable_path/.. \
            -o host/ios/Runtime/app
          file host/ios/Runtime/app
          ls -lh host/ios/Runtime/app
          ls -lh host/ios/Frameworks/libagovios.dylib
          nm -gU host/ios/Frameworks/libagovios.dylib | grep -E "agov_ios_(invoke|free)" || true


      - name: 准备 frpc（优先用包内预置的 arm64 二进制）
        env:
          SDK: ${{ steps.sdk.outputs.path }}
          CC_IOS: ${{ steps.sdk.outputs.cc }}
        run: |
          set -euo pipefail
          PREBUILT="host/ios/Frameworks/frpc-ios"
          if [ -f "${PREBUILT}" ] && [ "$(stat -f%z "${PREBUILT}")" -gt 1000000 ]; then
            echo "::group::使用仓库内预置的 frpc"
            file "${PREBUILT}"
            ls -lh "${PREBUILT}"
            shasum -a 256 "${PREBUILT}"
            echo "::endgroup::"
            exit 0
          fi
          echo "::group::没有预置 frpc，从源码编（frp v0.67.0）"
          # frp 的 go.mod 带 replace，不能 go install，只能拉源码在模块内构建；
          # GOOS=ios 强制要 cgo，CC / CGO_CFLAGS / CGO_LDFLAGS 都要指向 iphoneos SDK。
          git clone --depth 1 --branch v0.67.0 https://github.com/fatedier/frp "${RUNNER_TEMP}/frp"
          cd "${RUNNER_TEMP}/frp"
          # frp 的 cmd/frpc 用 //go:embed 嵌 web/frpc/dist（前端产物，需要 npm 构建）。
          # 我们只要客户端二进制，放个占位文件满足 embed 即可。
          mkdir -p web/frpc/dist
          [ -f web/frpc/dist/index.html ] || echo '<!doctype html><title>frpc</title>' > web/frpc/dist/index.html
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC_IOS}"
          # CXX 必须显式指向 iOS/simulator 的 clang++：cgo 编 .mm（ag_rec / imgui_overlay）靠它，
          # 缺省会退回 g++，.mm 直接被跳过 → 链接期报 _AGRecognition 未定义。
          export CXX="${CC_IOS}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fno-objc-arc"
          # -fobjc-arc：native 下的 .mm 用 ARC 写法（不手工 retain/release）
          # -F/-I：让 #import <opencv2/core.hpp> 能找到；找不到时 ag_rec.mm 自动降级为"识别栈不可用"
          export CGO_CXXFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN} -fobjc-arc -I ${PWD}/host/ios/Frameworks/opencv2.framework/Headers -I ${PWD}/host/ios/third_party/cimgui -I ${PWD}/host/ios/third_party/cimgui/imgui"
          export CGO_LDFLAGS="-isysroot ${SDK} -mios-version-min=${IOS_MIN}"
          go build -trimpath -ldflags "-s -w" -o "${RUNNER_TEMP}/frpc-ios" ./cmd/frpc
          file "${RUNNER_TEMP}/frpc-ios"
          mkdir -p "$GITHUB_WORKSPACE/host/ios/Frameworks"
          cp "${RUNNER_TEMP}/frpc-ios" "$GITHUB_WORKSPACE/${PREBUILT}"
          chmod +x "$GITHUB_WORKSPACE/${PREBUILT}"
          echo "::endgroup::"

      - name: 生成 Xcode 工程
        working-directory: host/ios
        run: |
          set -euo pipefail
          xcodegen generate
          ls -d *.xcodeproj

      - name: 编译 App（不签名）
        working-directory: host/ios
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project AgovHost.xcodeproj \
            -scheme AgovHost \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "::group::关键错误"
            grep -nE "error:|fatal error:|Undefined symbol|ld: |is only available" build.log | head -80 || true
            echo "::endgroup::"
            echo "::group::libagovios 产物"
            ls -l GoLib || true
            head -40 GoLib/libagovios.h 2>/dev/null || echo "没有 libagovios.h"
            echo "::endgroup::"
            exit "${status}"
          fi

      - name: 放入识别栈全套 dylib（与参考实现同目录 Runtime/）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          mkdir -p "${APP}/Runtime"
          copied=0
          for f in host/ios/Runtime/*.dylib; do
            [ -e "$f" ] || continue
            cp "$f" "${APP}/Runtime/"
            copied=$((copied+1))
          done
          echo "放入 ${copied} 个识别/推理 dylib"
          # imgui 也放进 Runtime：libagovios 的 install_name 是 @rpath/libimgui.dylib，
          # 而 App 已补 @executable_path/Runtime 这条 rpath（下面 install_name_tool）
          if [ -f host/ios/Frameworks/libimgui.dylib ]; then
            cp host/ios/Frameworks/libimgui.dylib "${APP}/Runtime/"
            echo "放入 libimgui.dylib"
          fi
          ls -lh "${APP}/Runtime" || true
          # 它们的 LC_RPATH 指向作者本机路径，补一条 app 内 rpath 才能解析 @rpath
          if [ -d "${APP}/Runtime" ]; then
            install_name_tool -add_rpath "@executable_path/Runtime" "${APP}/AgovHost" 2>/dev/null \
              || echo "（rpath 已存在或 add_rpath 不可用，忽略）"
          fi

      - name: 把三件套放进 app 包
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          [ -d "${APP}" ] || { echo "::error::没有 app 产物"; exit 1; }
          # frpc-ios：隧道客户端（预置二进制优先，源码编出来也放同一路径）
          if [ -f host/ios/Frameworks/frpc-ios ]; then
            cp host/ios/Frameworks/frpc-ios "${APP}/frpc-ios"; chmod +x "${APP}/frpc-ios"
          fi
          # libagovios.dylib：SDK/解释器（壳运行时 dlopen）
          if [ -f host/ios/Frameworks/libagovios.dylib ]; then
            cp host/ios/Frameworks/libagovios.dylib "${APP}/libagovios.dylib"
          fi
          # Runtime/app：任务执行体（壳 posix_spawn）
          if [ -f host/ios/Runtime/app ]; then
            mkdir -p "${APP}/Runtime"; cp host/ios/Runtime/app "${APP}/Runtime/app"; chmod +x "${APP}/Runtime/app"
          fi
          echo "放进包内的文件："; ls -lh "${APP}"

      - name: 安装打包工具（ldid / dpkg）
        run: |
          set +e
          brew install ldid 2>&1 | tail -5
          brew install dpkg 2>&1 | tail -5
          command -v ldid   && ldid -v 2>&1 | head -2
          command -v dpkg-deb && dpkg-deb --version | head -1
          echo "（缺哪个都继续：ldid 缺了就退化成 codesign）"

      - name: 注入 entitlements（签名用 codesign，不用 ldid）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          ENT="host/ios/entitlements.plist"
          [ -d "${APP}" ] || { echo "::error::没有 app 产物"; exit 1; }
          [ -f "${ENT}" ] || { echo "::error::缺少 ${ENT}"; exit 1; }

          # 为什么不用 ldid：实测 ldid.cpp 在解析我们这份 970 行 entitlements 时
          # 直接 _assert() 崩掉（errno=2 与 assert false 各一次）。
          # codesign 的 ad-hoc 签名同样能把 entitlements 嵌进签名，
          # 且 TrollStore 还会读取包内的 entitlements.plist，两条路都在。
          sign() {
            echo "签名 $1"
            codesign -f -s - --entitlements "${ENT}" "$1"
          }

          # 1) entitlements 放进包内（TrollStore 安装时会读）
          cp "${ENT}" "${APP}/entitlements.plist"

          # 2) 先签包内的独立二进制（顺序：子 → 主）
          if [ -f "${APP}/Runtime/app" ]; then sign "${APP}/Runtime/app"; fi
          if [ -f "${APP}/libagovios.dylib" ]; then sign "${APP}/libagovios.dylib"; fi
          if [ -f "${APP}/frpc-ios" ]; then sign "${APP}/frpc-ios"; fi
          # 识别栈的 dylib 也要逐个签，否则真机 dlopen 会被拦
          if [ -d "${APP}/Runtime" ]; then
            for f in "${APP}/Runtime"/*.dylib; do [ -e "$f" ] && sign "$f"; done
          fi

          # 3) 再签主程序与整个包
          sign "${APP}/AgovHost"
          sign "${APP}"

          # 4) 回读校验
          codesign -d --entitlements :- "${APP}" 2>/dev/null | head -20 || true
          codesign -dv "${APP}/libagovios.dylib" 2>&1 | head -5 || true

      - name: 断言 frpc 已进包
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          if [ ! -f "${APP}/frpc-ios" ]; then
            echo "::error::frpc-ios 不在 app 包内，隧道功能会失效"
            ls -la "${APP}" || true
            exit 1
          fi
          file "${APP}/frpc-ios"
          ls -lh "${APP}/frpc-ios"
          echo "✅ frpc-ios 已在包内"
          if [ -f "${APP}/Runtime/app" ]; then
            echo "✅ Runtime/app 已在包内（任务隔离就绪）"
          else
            echo "::warning::包内没有 Runtime/app"
          fi
          if [ -f "${APP}/libagovios.dylib" ]; then
            echo "✅ libagovios.dylib 已在包内（热更能力就绪）"
            nm -gU "${APP}/libagovios.dylib" | grep -E "agov_ios_(invoke|free)" || echo "::warning::dylib 里没找到导出符号"
          else
            echo "::warning::包内没有 libagovios.dylib（只能走静态 SDK）"
          fi
      - name: 打成 ipa（含 entitlements）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          rm -rf out && mkdir -p out/Payload
          cp -R "${APP}" out/Payload/
          ( cd out && zip -qry AgovHost.ipa Payload )
          ls -lh out/AgovHost.ipa
          unzip -l out/AgovHost.ipa | head -12

      - name: 打成 deb（越狱机直装）
        run: |
          set -euo pipefail
          APP="host/ios/build/Build/Products/Release-iphoneos/AgovHost.app"
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo "::warning::没有 dpkg-deb，跳过 deb（ipa 仍然可用）"
            exit 0
          fi
          ROOT="debroot"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}/DEBIAN" "${ROOT}/Applications"
          cp -R "${APP}" "${ROOT}/Applications/"
          cat > "${ROOT}/DEBIAN/control" <<'CONTROL'
          Package: dev.autogov.host
          Name: AgovHost
          Version: 0.1.0
          Architecture: iphoneos-arm64
          Description: AutoGo 兼容的 iOS 自动化宿主（诊断版）
          Maintainer: autogov
          Section: Applications
          CONTROL
          dpkg-deb -b --root-owner-group "${ROOT}" out/AgovHost.deb
          ls -lh out/AgovHost.deb

      - name: 上传 ipa 与 deb
        uses: actions/upload-artifact@v4
        with:
          name: AgovHost-signed
          path: |
            out/AgovHost.ipa
            out/AgovHost.deb
          if-no-files-found: warn
          retention-days: 14

  # ── 3. 模拟器冒烟：启动 + 截图 ───────────────────────────────────────
  #
  # 这一轮的用途只有一个：证明 App 能启动、界面正常、Go↔ObjC 桥接通。
  # 模拟器里没有 IOHIDEvent / CARenderServer / Accessibility，
  # 所以 capabilities 会全 false —— 那是预期结果，不是失败。
  ios-sim:
    name: 模拟器冒烟（启动 + 截图）
    needs: ios-sdk
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OBJC_ARC_FLAG: '-fno-objc-arc'
      IOS_MIN: '15.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: 确定构建架构
        id: arch
        run: |
          MACHINE="$(uname -m)"
          if [ "${MACHINE}" = "arm64" ]; then
            echo "goarch=arm64" >> "$GITHUB_OUTPUT"
            echo "xcarch=arm64" >> "$GITHUB_OUTPUT"
            echo "other=x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "goarch=amd64" >> "$GITHUB_OUTPUT"
            echo "xcarch=x86_64" >> "$GITHUB_OUTPUT"
            echo "other=arm64" >> "$GITHUB_OUTPUT"
          fi
          echo "跑器架构: ${MACHINE}"

      - name: 选一台可用的 iPhone 模拟器
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "${RUNNER_TEMP}/devices.json"
          UDID=$(python3 - "${RUNNER_TEMP}/devices.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          names, udids = [], []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      udids.append(d["udid"]); names.append(runtime.split(".")[-1] + "/" + d["name"])
          if not udids:
              sys.exit(1)
          print(udids[0]); print(" + ".join(names[:3]), file=sys.stderr)
          PY
          )
          [ -n "${UDID}" ] || { echo "::error::runner 上没有可用的 iPhone 模拟器"; xcrun simctl list runtimes; exit 1; }
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          echo "选中的模拟器: ${UDID}"

      - name: 解析模拟器 SDK
        id: simsdk
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "path=${SDK}" >> "$GITHUB_OUTPUT"
          echo "cc=$(xcrun --sdk iphonesimulator -f clang)" >> "$GITHUB_OUTPUT"

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 编 libimgui.dylib（模拟器版）
        run: |
          set -euo pipefail
          CIMGUI=host/ios/third_party/cimgui
          IMGUI="${CIMGUI}/imgui"
          [ -f "${CIMGUI}/cimgui.cpp" ] || { echo "::error::缺少 cimgui 源码"; exit 1; }
          SDK_DIR=$(xcrun --sdk iphonesimulator --show-sdk-path)
          XCARCH=${{ steps.arch.outputs.xcarch }}
          OBJ=host/ios/Frameworks/imgui-obj-sim
          rm -rf "${OBJ}"; mkdir -p "${OBJ}" host/ios/Frameworks-sim
          CXXFLAGS="-O2 -std=c++17 -fno-exceptions -isysroot ${SDK_DIR} -mios-simulator-version-min=15.0 -arch ${XCARCH} -I ${CIMGUI} -I ${IMGUI} -I ${IMGUI}/backends"
          for f in imgui imgui_draw imgui_tables imgui_widgets imgui_demo; do
            xcrun --sdk iphonesimulator clang++ -c ${CXXFLAGS} "${IMGUI}/$f.cpp" -o "${OBJ}/$f.o"
          done
          xcrun --sdk iphonesimulator clang++ -c ${CXXFLAGS} "${CIMGUI}/cimgui.cpp" -o "${OBJ}/cimgui.o"
          xcrun --sdk iphonesimulator clang++ -c ${CXXFLAGS} -I sdk/ios/imgui "${CIMGUI}/ag_bridge.cpp" -o "${OBJ}/ag_bridge.o"
          xcrun --sdk iphonesimulator clang++ -c ${CXXFLAGS} -fobjc-arc "${IMGUI}/backends/imgui_impl_metal.mm" -o "${OBJ}/imgui_impl_metal.o"
          xcrun --sdk iphonesimulator clang++ -dynamiclib -arch "${XCARCH}" -isysroot "${SDK_DIR}" \
            -mios-simulator-version-min=15.0 -install_name @rpath/libimgui.dylib \
            "${OBJ}"/*.o -framework Metal -framework MetalKit -framework UIKit \
            -framework Foundation -framework CoreGraphics -lc++ \
            -o host/ios/Frameworks/libimgui.dylib
          file host/ios/Frameworks/libimgui.dylib

      - name: 编 libagovnative.a（模拟器版，ObjC++ 层）
        run: |
          set -euo pipefail
          SDK_DIR=$(xcrun --sdk iphonesimulator --show-sdk-path)
          XCARCH=${{ steps.arch.outputs.xcarch }}
          OBJ=host/ios/Frameworks/native-objc-sim
          rm -rf "${OBJ}"; mkdir -p "${OBJ}" host/ios/Frameworks
          FLAGS="-O2 -std=c++17 -fobjc-arc -isysroot ${SDK_DIR} -mios-simulator-version-min=15.0 -arch ${XCARCH} \
            -I sdk/ios/internal/native \
            -I host/ios/third_party/cimgui -I host/ios/third_party/cimgui/imgui -I host/ios/third_party/cimgui/imgui/backends"
          for f in ag_rec imgui_overlay; do
            xcrun --sdk iphonesimulator clang++ -c ${FLAGS} "host/ios/objc/$f.mm" -o "${OBJ}/$f.o"
          done
          libtool -static -o host/ios/Frameworks/libagovnative.a "${OBJ}"/*.o
          ls -lh host/ios/Frameworks/libagovnative.a

      - name: Go 出模拟器 dylib（归档 + clang -dynamiclib）
        env:
          SDK: ${{ steps.simsdk.outputs.path }}
          CC_SIM: ${{ steps.simsdk.outputs.cc }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 GOOS=ios GOARCH=${{ steps.arch.outputs.goarch }} CC="${CC_SIM}"
          export CGO_CFLAGS="-isysroot ${SDK} -mios-simulator-version-min=${IOS_MIN} ${OBJC_ARC_FLAG}"
          export CGO_LDFLAGS="-isysroot ${SDK} -mios-simulator-version-min=${IOS_MIN}"
          mkdir -p host/ios/GoLib host/ios/Frameworks
          # 1) 静态归档
          go build -buildmode=c-archive -o host/ios/GoLib/libagovios.a ./cmd/ioshost
          # 2) 包成 dylib（模拟器架构 + 模拟器 SDK，宿主会在运行时 dlopen 它）
          # 模拟器里同样链 Runtime/libopencv_*.dylib（设备版架构不匹配，所以模拟器先不链）
          OPENCV_FLAGS=""
          IMGUI_LIB=""
          if [ -f host/ios/Frameworks/libimgui.dylib ]; then IMGUI_LIB="-L host/ios/Frameworks -limgui"; fi
          clang -dynamiclib -arch ${{ steps.arch.outputs.xcarch }} -isysroot "${SDK}" \
            -mios-simulator-version-min="${IOS_MIN}" \
            -Wl,-all_load host/ios/GoLib/libagovios.a \
            host/ios/Frameworks/libagovnative.a \
            ${IMGUI_LIB} \
            -framework Foundation -framework UIKit -framework JavaScriptCore -framework CoreFoundation \
            -framework CoreGraphics -framework ImageIO -framework VideoToolbox \
            -framework CoreMedia -framework CoreVideo -framework Security \
            -framework QuartzCore \
            -framework Accelerate -framework Metal -framework MetalKit \
            -framework IOKit -framework NetworkExtension \
            ${OPENCV_FLAGS} \
            -lresolv -lpthread -lm -lc++ -lc++abi \
            -Wl,-exported_symbol,_agov_ios_invoke \
            -Wl,-exported_symbol,_agov_ios_free \
            -Wl,-exported_symbol,_GoMain \
            -Wl,-exported_symbol,_AXBootstrap \
            -Wl,-exported_symbol,_AXSweepNodesJSON \
            -o host/ios/Frameworks/libagovios.dylib
          file host/ios/Frameworks/libagovios.dylib
          # 断言导出符号真的在（dlsym 失败过两次，所以这里必须校验）
          # 同样先落盘再 grep：`nm | grep -q` 在 pipefail 下会因 SIGPIPE 假失败
          nm -gU host/ios/Frameworks/libagovios.dylib > /tmp/agov-syms.txt 2>/dev/null || true
          for sym in _agov_ios_invoke _agov_ios_free _GoMain _AXBootstrap _AXSweepNodesJSON; do
            if ! grep -q " $sym$" /tmp/agov-syms.txt; then
              echo "::error::dylib 缺少导出符号 $sym"
              grep -E "_agov|_GoMain|_AX" /tmp/agov-syms.txt | head -20 || true
              exit 1
            fi
          done
          echo "✅ 五个入口都导出了"
          mkdir -p host/ios/Runtime
          xcrun --sdk iphonesimulator clang -arch ${{ steps.arch.outputs.xcarch }} -isysroot "${SDK}" \
            -mios-simulator-version-min="${IOS_MIN}" -fobjc-arc host/ios/RuntimeMain.m \
            -framework Foundation -framework CoreFoundation \
            -Wl,-rpath,@executable_path -Wl,-rpath,@executable_path/.. \
            -o host/ios/Runtime/app
          ls -lh host/ios/Runtime/app
          ls -lh host/ios/Frameworks/libagovios.dylib

      - name: 生成 Xcode 工程
        working-directory: host/ios
        run: xcodegen generate

      - name: 编 App（模拟器）
        working-directory: host/ios
        run: |
          set -o pipefail
          set +e
          # 只出 arm64：macos-15 跑器是 Apple Silicon，模拟器原生跑 arm64；
          # 而我们的 Go 归档是 arm64 单架构 —— 默认 xcodebuild 会做 arm64+x86_64
          # 通用二进制，x86_64 那半在没有归档的情况下必然 undefined symbols。
          xcodebuild -project AgovHost.xcodeproj -scheme AgovHost \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            ARCHS=${{ steps.arch.outputs.xcarch }} ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=${{ steps.arch.outputs.other }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee sim-build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "::group::模拟器编译错误"
            grep -nE "error:|Undefined symbol|ld: " sim-build.log | head -40 || true
            echo "::endgroup::"
            exit "${status}"
          fi

      - name: 把 dylib / Runtime/app 放进模拟器 App 包并重签
        run: |
          set -euo pipefail
          APP=$(find host/ios/build -name "AgovHost.app" -maxdepth 8 | head -1)
          [ -d "${APP}" ] || { echo "::error::没找到模拟器产物"; exit 1; }
          if [ -f host/ios/Frameworks/libagovios.dylib ]; then
            cp host/ios/Frameworks/libagovios.dylib "${APP}/libagovios.dylib"
            echo "已放入 libagovios.dylib"
          fi
          # imgui：libagovios 的 install_name 是 @rpath/libimgui.dylib，必须和它同目录
          if [ -f host/ios/Frameworks/libimgui.dylib ]; then
            cp host/ios/Frameworks/libimgui.dylib "${APP}/libimgui.dylib"
            echo "已放入 libimgui.dylib（模拟器版）"
          else
            echo "::warning::没有模拟器版 libimgui.dylib，dlopen 会失败"
          fi
          if [ -f host/ios/Runtime/app ]; then
            mkdir -p "${APP}/Runtime"; cp host/ios/Runtime/app "${APP}/Runtime/app"; chmod +x "${APP}/Runtime/app"
            echo "已放入 Runtime/app"
          fi
          # frpc-ios 也放进去：否则"启动穿透"必然报"找不到 frpc-ios"
          # （模拟器连不上 frps 是另一回事，但二进制得在）
          if [ -f host/ios/Frameworks/frpc-ios ]; then
            cp host/ios/Frameworks/frpc-ios "${APP}/frpc-ios"; chmod +x "${APP}/frpc-ios"
            echo "已放入 frpc-ios"
          fi
          # 独立执行体必须先签名，再签外层 App。
          [ ! -f "${APP}/Runtime/app" ] || codesign -f -s - "${APP}/Runtime/app"
          # 往已签名的 app 里塞文件会让签名失效，模拟器也要重签一次
          codesign -f -s - "${APP}" 2>/dev/null || echo "（重签失败，模拟器通常仍可运行）"
          ls -lh "${APP}"; ls -lh "${APP}/Runtime" 2>/dev/null || true

      - name: 启动模拟器并安装
        id: run
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "${UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${UDID}" -b
          APP=$(find host/ios/build -name 'AgovHost.app' -maxdepth 8 | head -1)
          [ -d "${APP}" ] || { echo "::error::没找到模拟器产物"; ls -R host/ios/build/Build/Products || true; exit 1; }
          xcrun simctl install "${UDID}" "${APP}"
          xcrun simctl launch "${UDID}" dev.autogov.host || true
          # 安装后执行真正的工作进程和宿主 JS 检查；不再固定睡 8 秒便宣称成功。
          CONTAINER=$(xcrun simctl get_app_container "${UDID}" dev.autogov.host data)
          for attempt in $(seq 1 90); do
            [ -f "${CONTAINER}/Documents/script-check.json" ] && [ -f "${CONTAINER}/Documents/js-check.json" ] && [ -f "${CONTAINER}/Documents/native-diagnostics.done" ] && break
            sleep 1
          done
          python3 - "${CONTAINER}/Documents" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          assert (root/'native-diagnostics.done').exists(), '截图/AX 专项诊断未完成，不能只收集半份结果'
          for context in ['host','worker']:
              report=json.loads((root/f'native-diagnostics-{context}.json').read_text())
              print('原生诊断',context,'调用完成:',report.get('ok'), '；采集成功与否以完整 JSON 为准')
          script=json.loads((root/'script-check.json').read_text())
          data=script.get('data',{})
          assert script.get('ok') and data.get('ok'), '工作进程执行失败: '+str(data.get('error',script.get('error')))
          assert data.get('processId',0)>0, '没有返回真实工作进程 PID'
          assert data.get('result',{}).get('interpreterCompleted'), '解释器没有完整执行'
          js=json.loads((root/'js-check.json').read_text())
          assert js.get('ok') and js.get('data',{}).get('result')=='3', 'JavaScriptCore 通道没有实际返回 3'
          print('工作进程 PID:',data['processId'],'；JavaScriptCore: 1+2=3')
          PY
          xcrun simctl io "${UDID}" screenshot "${RUNNER_TEMP}/sim.png"
          ls -l "${RUNNER_TEMP}/sim.png"

      - name: 取 App 沙盒里的文件（capture.jpg 等）
        if: always()
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          CONTAINER=$(xcrun simctl get_app_container "${UDID}" dev.autogov.host data 2>/dev/null || true)
          echo "容器: ${CONTAINER}"
          if [ -n "${CONTAINER}" ] && [ -d "${CONTAINER}/Documents" ]; then
            mkdir -p "${RUNNER_TEMP}/app-docs"
            cp -R "${CONTAINER}/Documents/." "${RUNNER_TEMP}/app-docs/" || true
            ls -lh "${RUNNER_TEMP}/app-docs"
          else
            echo "（拿不到容器或没有 Documents）"
          fi

      - name: 抓日志（失败时用）
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "${UDID}" log show --last 2m --style compact \
            --predicate 'process == "AgovHost"' 2>/dev/null | tail -60 || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: |
            ${{ runner.temp }}/sim.png
            ${{ runner.temp }}/app-docs
          if-no-files-found: warn
          retention-days: 14
